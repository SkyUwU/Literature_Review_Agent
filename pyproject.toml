[project]
name = "literature-review-agent"
version = "0.1.0"
description = "A traceable literature-review workflow for research ideas."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pypdf>=5.0",
    "google-genai>=1.0",
    "langfuse>=4.15.1",
    "sentence-transformers>=6.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
